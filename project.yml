# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`.
name: Constellation
options:
  bundleIdPrefix: tech.wolff
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Developer ID keeps the Keychain ACL stable across rebuilds. CI passes
    # CODE_SIGNING_ALLOWED=NO because runners have no identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: 45QKSLQ5S4
    DEAD_CODE_STRIPPING: YES
    # Scripts/release.sh overrides both on the command line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ConstellationCore:
    path: Packages/ConstellationCore
  ConstellationTerminal:
    path: Packages/ConstellationTerminal
  ConstellationInfrastructure:
    path: Packages/ConstellationInfrastructure
  ConstellationRemoteDesktop:
    path: Packages/ConstellationRemoteDesktop
targets:
  Constellation:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Licenses
      # Folder reference so the manifest and license texts ship under Resources/Licenses.
      - path: App/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConstellationCore
      - package: ConstellationTerminal
      - package: ConstellationInfrastructure
        product: ConstellationStorage
      - package: ConstellationInfrastructure
        product: ConstellationOpenSSH
      - package: ConstellationInfrastructure
        product: constellation-askpass
        link: false
      - package: ConstellationRemoteDesktop
        product: ConstellationRemoteDesktop
      - package: ConstellationRemoteDesktop
        product: ConstellationVNC
      - package: ConstellationRemoteDesktop
        product: ConstellationRDP
    # ssh runs the helper as a separate process, so it ships beside the app binary.
    postBuildScripts:
      - name: Embed constellation-askpass
        script: |
          helper_destination="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/constellation-askpass"
          cp -f "${BUILT_PRODUCTS_DIR}/constellation-askpass" "${helper_destination}"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
            # Notarization needs a secure timestamp on nested code; skip the network round trip in Debug.
            timestamp="--timestamp=none"
            if [ "${CONFIGURATION}" = "Release" ]; then timestamp="--timestamp"; fi
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime "${timestamp}" "${helper_destination}"
          fi
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/constellation-askpass
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/constellation-askpass
      # libghostty finds themes and terminfo by climbing from the executable to
      # Contents/Resources, so the zig build's share directory ships in the bundle.
      - name: Embed Ghostty resources
        script: |
          share="${SRCROOT}/Vendor/ghostty/zig-out/share"
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -d "${share}/ghostty" ]; then
            echo "error: ${share}/ghostty is missing; run Scripts/build-libghostty.sh" >&2
            exit 1
          fi
          mkdir -p "${resources}"
          rm -rf "${resources}/ghostty" "${resources}/terminfo"
          /usr/bin/ditto "${share}/ghostty" "${resources}/ghostty"
          /usr/bin/ditto "${share}/terminfo" "${resources}/terminfo"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ghostty/themes
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Constellation
        CFBundleDisplayName: Constellation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Wolff.Tech"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolff.Constellation
        PRODUCT_NAME: Constellation
        # App/AppIcon.icon is an Icon Composer document; actool also emits the
        # .icns fallback for macOS 15.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libghostty's static library pulls in C++ (harfbuzz, freetype).
        OTHER_LDFLAGS: ["-lc++"]
  ConstellationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/App
    dependencies:
      - target: Constellation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolff.ConstellationTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Constellation.app/Contents/MacOS/Constellation
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Constellation:
    build:
      targets:
        Constellation: all
        ConstellationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConstellationTests
        - package: ConstellationCore/ConstellationCoreTests
        - package: ConstellationTerminal/ConstellationTerminalTests
        - package: ConstellationInfrastructure/ConstellationStorageTests
        - package: ConstellationInfrastructure/ConstellationOpenSSHTests
        - package: ConstellationRemoteDesktop/ConstellationVNCTests
        - package: ConstellationRemoteDesktop/ConstellationRDPTests
