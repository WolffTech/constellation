name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Cache Zig toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            .tools
            Vendor/ghostty/.zig-cache
            ~/.cache/zig
          key: libghostty-${{ runner.os }}-${{ hashFiles('Scripts/build-libghostty.sh') }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            libghostty-${{ runner.os }}-${{ hashFiles('Scripts/build-libghostty.sh') }}-

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build libghostty
        run: Scripts/build-libghostty.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: xcodebuild -project Constellation.xcodeproj -scheme Constellation -configuration Debug -destination 'platform=macOS,arch=arm64' build CODE_SIGNING_ALLOWED=NO | xcbeautify || true

      - name: Run package tests
        run: xcodebuild -project Constellation.xcodeproj -scheme Constellation -destination 'platform=macOS,arch=arm64' test CODE_SIGNING_ALLOWED=NO
