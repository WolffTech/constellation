name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Check release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # Full history: the build number is the commit count on the tag.
          fetch-depth: 0

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Derive version from tag
        run: |
          {
            echo "APP_VERSION=${GITHUB_REF_NAME#v}"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"

      # Reuse native libraries and their source archives cached by CI on main.
      # Changed dependency pins or build scripts still trigger a rebuild.
      - name: Build native libraries
        uses: ./.github/actions/native-libraries

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild -project Constellation.xcodeproj -scheme Constellation \
            -destination 'platform=macOS,arch=arm64' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build, sign, notarize, and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_FILE"
          trap 'rm -f "$NOTARY_KEY_FILE"' EXIT
          export NOTARY_KEY_FILE
          Scripts/release.sh "$APP_VERSION" "$BUILD_NUMBER"

      - name: Package corresponding source
        run: Scripts/package-source.sh "$APP_VERSION"

      # Sparkle shows release notes in the update prompt, so they are needed
      # before the appcast exists. A release made in the GitHub UI already has
      # notes; for a plain pushed tag GitHub generates them here, and the
      # publish step reuses them so the release page matches the prompt.
      #
      # Sparkle only shows the notes of the version it offers, so the prompt
      # also carries the notes of a few earlier releases: someone skipping
      # versions still sees what changed in between.
      - name: Collect release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EARLIER_RELEASES: "4"
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$NOTES" 2> /dev/null; then
            gh api "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > "$NOTES"
          fi
          cat "$NOTES"

          # Each release goes under its own version heading, so its own
          # headings ("What's Changed") move down a level.
          demote_headings() { sed -E 's/^(#{1,5}) /#\1 /'; }
          # The newest release tags older than this one, newest first.
          earlier_tags() {
            {
              gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
                --json tagName --jq '.[].tagName'
              echo "$GITHUB_REF_NAME"
            } | sort -u -r -V | awk -v current="$GITHUB_REF_NAME" -v limit="$EARLIER_RELEASES" '
              seen && /^v[0-9]+\.[0-9]+\.[0-9]+$/ && n++ < limit { print }
              $0 == current { seen = 1 }'
          }
          {
            printf '## Version %s\n\n' "$APP_VERSION"
            demote_headings < "$NOTES"
            earlier_tags | while read -r tag; do
              printf '\n## Version %s\n\n' "${tag#v}"
              gh release view "$tag" --json body --jq .body | demote_headings
            done
          } > "$RUNNER_TEMP/update-notes.md"
          cat "$RUNNER_TEMP/update-notes.md"

      # The EdDSA signature covers the exact DMG bytes, so this runs on the
      # final signed, notarized, stapled image, and that same file is the one
      # uploaded below. The app's SUFeedURL is the appcast attached to the
      # latest release, so every tag must publish as a full release.
      - name: Generate Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.10.0
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/sparkle-dist" "$RUNNER_TEMP/appcast-archives"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-dist"
          # generate_appcast writes state next to its archives; give it a
          # copy so nothing touches the DMG that gets uploaded.
          cp "build/release/$APP_VERSION/Constellation-$APP_VERSION.dmg" "$RUNNER_TEMP/appcast-archives/"
          # An HTML file named after the DMG becomes the item's embedded
          # release notes. GitHub renders the Markdown so links to pull
          # requests, users, and the changelog match the release page.
          gh api markdown \
            -F text=@"$RUNNER_TEMP/update-notes.md" \
            -f mode=gfm \
            -f context="$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/appcast-archives/Constellation-$APP_VERSION.html"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle-dist/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              --embed-release-notes \
              -o "build/release/$APP_VERSION/appcast.xml" \
              "$RUNNER_TEMP/appcast-archives"
          # generate_appcast only signs bundles whose Info.plist has SUPublicEDKey.
          grep -q 'sparkle:edSignature=' "build/release/$APP_VERSION/appcast.xml"
          grep -q '<description>' "build/release/$APP_VERSION/appcast.xml"
          cat "build/release/$APP_VERSION/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DMG="build/release/$APP_VERSION/Constellation-$APP_VERSION.dmg"
          SOURCE_ZIP="build/release/$APP_VERSION/Constellation-$APP_VERSION-source.zip"
          APPCAST="build/release/$APP_VERSION/appcast.xml"
          # A tag created through the GitHub release UI already has a release;
          # attach the artifacts to it. A plain pushed tag gets a new release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$DMG" "$DMG.sha256" \
              "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" \
              "$APPCAST" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Constellation $APP_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              "$DMG" "$DMG.sha256" \
              "$SOURCE_ZIP" "$SOURCE_ZIP.sha256" \
              "$APPCAST"
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
